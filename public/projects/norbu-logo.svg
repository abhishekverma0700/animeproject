<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="norbuGrad" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagonal Frame -->
  <path
    class="norbu-stroke"
    d="M80 18 L134 49 L134 111 L80 142 L26 111 L26 49 Z"
    stroke="url(#norbuGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <!-- Inner Medical Cross & Shield Facets -->
  <path
    class="norbu-stroke"
    d="M80 38 L80 122"
    stroke="#38bdf8"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    class="norbu-stroke"
    d="M38 80 L122 80"
    stroke="#38bdf8"
    stroke-width="3"
    stroke-linecap="round"
  />
  <!-- Diamond Core -->
  <path
    class="norbu-stroke"
    d="M80 50 L110 80 L80 110 L50 80 Z"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Accent Node Dots -->
  <circle cx="80" cy="18" r="3.5" fill="#38bdf8" />
  <circle cx="134" cy="49" r="3.5" fill="#38bdf8" />
  <circle cx="134" cy="111" r="3.5" fill="#38bdf8" />
  <circle cx="80" cy="142" r="3.5" fill="#38bdf8" />
  <circle cx="26" cy="111" r="3.5" fill="#38bdf8" />
  <circle cx="26" cy="49" r="3.5" fill="#38bdf8" />
  <circle cx="80" cy="80" r="4.5" fill="#ffffff" />
</svg>
